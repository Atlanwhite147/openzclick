<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="openzclick architecture: controller, application, training app">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b95a7"/>
    </marker>
  </defs>

  <rect width="920" height="300" rx="16" fill="#0f1115"/>

  <!-- controller -->
  <rect x="28" y="96" width="150" height="104" rx="12" fill="#171a21" stroke="#2a2f3a"/>
  <text x="103" y="130" text-anchor="middle" fill="#e6e9ef" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Controller</text>
  <text x="103" y="152" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">two buttons</text>
  <text x="103" y="172" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Bluetooth LE</text>

  <!-- arrow BLE -->
  <line x1="182" y1="148" x2="248" y2="148" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="138" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">BLE</text>

  <!-- app block -->
  <rect x="252" y="56" width="392" height="188" rx="14" fill="#141821" stroke="#2f6fed" stroke-width="2"/>
  <text x="448" y="84" text-anchor="middle" fill="#e6e9ef" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">openzclick</text>
  <text x="448" y="104" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">one Dart codebase</text>

  <rect x="272" y="120" width="106" height="52" rx="8" fill="#1a1f2b" stroke="#2a2f3a"/>
  <text x="325" y="142" text-anchor="middle" fill="#cfd6e2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">session</text>
  <text x="325" y="159" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10">ECDH + AES-CCM</text>

  <rect x="392" y="120" width="106" height="52" rx="8" fill="#1a1f2b" stroke="#2a2f3a"/>
  <text x="445" y="142" text-anchor="middle" fill="#cfd6e2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">gears</text>
  <text x="445" y="159" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10">12 / 24 / 8 speeds</text>

  <rect x="512" y="120" width="112" height="52" rx="8" fill="#1a1f2b" stroke="#2a2f3a"/>
  <text x="568" y="142" text-anchor="middle" fill="#cfd6e2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">gestures</text>
  <text x="568" y="159" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10">shift / direction</text>

  <text x="448" y="200" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">core: no I/O, fully tested</text>
  <text x="448" y="220" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">transports: mDNS / DNS-SD + TCP</text>

  <!-- arrow network -->
  <line x1="648" y1="148" x2="740" y2="148" stroke="#8b95a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="138" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">local network</text>

  <!-- training app -->
  <rect x="744" y="96" width="150" height="104" rx="12" fill="#171a21" stroke="#2a2f3a"/>
  <text x="819" y="130" text-anchor="middle" fill="#e6e9ef" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Training app</text>
  <text x="819" y="152" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">OpenBikeControl</text>
  <text x="819" y="172" text-anchor="middle" fill="#8b95a7" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">trainer resistance</text>
</svg>
