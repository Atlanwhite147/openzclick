name: iOS build
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build unsigned app bundle
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package into an unsigned IPA
        working-directory: app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry openzclick-unsigned.ipa Payload
          ls -lh openzclick-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: openzclick-ios-unsigned
          path: app/build/ios/ipa/openzclick-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openzclick-ios-unsigned
          path: dist

      - name: Publish or refresh the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/openzclick-unsigned.ipa
          body: |
            Unsigned iOS build of openzclick, produced by the `iOS build` workflow.

            Install with Sideloadly or AltStore using a free Apple ID (the signature
            expires after 7 days) or a paid developer account.
