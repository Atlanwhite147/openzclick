name: iOS build
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build unsigned app bundle
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package into an unsigned IPA
        working-directory: app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry openzclick-unsigned.ipa Payload
          ls -lh openzclick-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: openzclick-ios-unsigned
          path: app/build/ios/ipa/openzclick-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
