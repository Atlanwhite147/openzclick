name: macOS build

# The one-codebase claim in the README covers macOS, and `app/macos/` has been
# in the tree since the project was created, but no workflow ever built it: the
# latest release shipped the Windows, Android and iOS artifacts and nothing a
# Mac could open. This job closes that gap.
#
# What a Mac gets: the controller pairing, the gears, the network publication
# and the console. What it does not get is keyboard injection. macOS has no
# backend in `lib/net/desktop_injection_native.dart` (it returns `null`, and the
# switch stays disabled with a reason), so the release is honest about it rather
# than failing on the first press. See issue #2.
#
# The bundle is unsigned. Gatekeeper will refuse it on first launch until the
# rider allows it in System Settings, exactly like the unsigned IPA needs
# Sideloadly. The README says so.

on:
  push:
    branches: [main]
    # The build compiles `app/`, but `app/` depends on `core/` and
    # `transports/` (path dependencies in `app/pubspec.yaml`): a commit that
    # only touched one of those still changes what runs on the Mac, and was
    # missed while this list watched `app/**` alone.
    paths:
      - 'app/**'
      - 'core/**'
      - 'transports/**'
      - 'pubspec*'
      - 'app/pubspec*'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # macOS has no `--no-codesign` flag: `flutter build macos` never accepted
      # it (flutter/flutter#169034 added it, was reverted). Passing it fails with
      # "Could not find an option named --no-codesign" before the build starts,
      # which is what the first run of this workflow did.
      #
      # Flutter forwards FLUTTER_XCODE_* to xcodebuild, so signing is disabled
      # where Xcode reads it. The Runner target already carries
      # CODE_SIGN_IDENTITY = "-" (ad hoc), which is what a machine with no Apple
      # identity can produce.
      - name: Build release
        working-directory: app
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: "-"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ""
        run: flutter build macos --release

      # ditto, not zip: it preserves the resource forks, the symlinks and the
      # executable bits that a .app bundle needs. A plain `zip -r` produces an
      # archive that unpacks into an application macOS calls damaged.
      #
      # The steps fail loudly rather than upload an empty or truncated archive:
      # a .app that built but packaged wrong would otherwise reach the release
      # and be discovered by a rider.
      - name: Package
        working-directory: app
        run: |
          set -euo pipefail
          APP=build/macos/Build/Products/Release/openzclick.app
          if [ ! -d "$APP" ]; then
            echo "no bundle at $APP; what did build do?" >&2
            ls -la build/macos/Build/Products/ 2>/dev/null >&2 || true
            exit 1
          fi
          # The compiled Dart lives in Frameworks/App.framework; a bundle missing
          # it is an empty shell, not the application.
          if [ ! -d "$APP/Contents/Frameworks/App.framework" ]; then
            echo "the bundle has no App.framework: nothing was compiled into it" >&2
            find "$APP/Contents" -maxdepth 2 >&2 || true
            exit 1
          fi
          ditto -c -k --keepParent "$APP" build/openzclick-macos.zip
          ls -lh build/openzclick-macos.zip
          # An archive smaller than the bundle it came from is a packaging bug.
          echo "bundle: $(du -sh "$APP" | cut -f1), archive: $(du -sh build/openzclick-macos.zip | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: openzclick-macos
          path: app/build/openzclick-macos.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          files: app/build/openzclick-macos.zip
          body: |
            Unattended builds of openzclick, produced by CI.

            - `openzclick-macos.zip` - macOS (Apple silicon and Intel): unzip,
              drag `openzclick.app` into Applications. Unsigned, so the first
              launch is refused by Gatekeeper: open System Settings > Privacy &
              Security, scroll down and press **Open Anyway**. Controller
              pairing, gears, network publication and the console work. Keyboard
              injection does not: macOS has no backend yet.
            - `openzclick-setup.exe` - Windows installer: per-user, no administrator
              prompt, shortcut and uninstaller included
            - `openzclick-windows-x64.zip` - Windows, unzip and run `openzclick.exe`
            - `app-release.apk` - Android, sideload directly (debug signing key)
            - `openzclick-unsigned.ipa` - iOS, sign with Sideloadly or AltStore
            - `app.swbn` and `update_manifest.json` - the Isolated Web App bundle

            The non-macOS assets are built on request: they stay attached to
            this release until the next run of their own workflow replaces
            them. To refresh one, run its workflow by hand, as the README's
            Download section shows (`gh workflow run "Windows build" ...`).

            This file previously described only the macOS artifact. A GitHub
            release body is replaced whole by whichever workflow publishes
            last, so every publishing workflow now lists every asset, including
            the ones it does not build.
