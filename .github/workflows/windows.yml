name: Windows build

# The four platform claim in the README only holds if the desktop builds are
# produced: this job turns the Windows sources that ship with the application
# into an archive a rider can unzip and run.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build release
        working-directory: app
        run: flutter build windows --release

      - name: Package
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/openzclick-windows-x64.zip -Force
          Get-Item build/openzclick-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: openzclick-windows-x64
          path: app/build/openzclick-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          files: app/build/openzclick-windows-x64.zip
          body: |
            Unattended builds of openzclick, produced by CI.

            - `openzclick-windows-x64.zip` - Windows, unzip and run `openzclick.exe`
            - `app-release.apk` - Android, sideload directly (debug signing key)
            - `openzclick-unsigned.ipa` - iOS, sign with Sideloadly or AltStore
