name: Windows build

# The four platform claim in the README only holds if the desktop builds are
# produced: this job turns the Windows sources that ship with the application
# into an archive a rider can unzip and run.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build release
        working-directory: app
        run: flutter build windows --release

      - name: Package
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/openzclick-windows-x64.zip -Force
          Get-Item build/openzclick-windows-x64.zip | Select-Object Name, Length

      # The zip is for the rider who wants to look inside; the installer is what
      # makes this an installation rather than a folder to remember.
      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\openzclick.iss'
        shell: pwsh

      # An installer nobody installed is a guess. This runs it silently on the
      # runner, checks the application landed, then uninstalls and checks it left
      # nothing behind — the two things a rider would find out the hard way.
      - name: The installer installs, and uninstalls
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ozc-install'
          $setup = 'installer\Output\openzclick-setup.exe'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }

          # A Flutter Windows executable is a small launcher: the compiled Dart
          # lives in data\app.so and the engine in flutter_windows.dll. Sizing the
          # launcher is therefore not a check of anything — an earlier version of
          # this step demanded 1 MB and failed an installer that had worked.
          $exe = Join-Path $dir 'openzclick.exe'
          if (-not (Test-Path $exe)) { throw 'openzclick.exe is not where the installer said it would be' }
          foreach ($needed in @('data\app.so', 'data\icudtl.dat', 'flutter_windows.dll')) {
            if (-not (Test-Path (Join-Path $dir $needed))) { throw "$needed was not installed" }
          }
          $app = Get-Item (Join-Path $dir 'data\app.so')
          Write-Host "installed: launcher $([math]::Round((Get-Item $exe).Length/1KB,0)) Ko, application $([math]::Round($app.Length/1MB,2)) Mo"
          if ($app.Length -lt 1MB) { throw 'the compiled application is too small to be the program' }

          $uninstaller = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'the installer registered no uninstaller' }
          Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait | Out-Null
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw 'uninstall left the application behind' }
          Write-Host 'uninstalled: nothing left'

      - uses: actions/upload-artifact@v4
        with:
          name: openzclick-windows-x64
          path: |
            app/build/openzclick-windows-x64.zip
            installer/Output/openzclick-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            app/build/openzclick-windows-x64.zip
            installer/Output/openzclick-setup.exe
          body: |
            Unattended builds of openzclick, produced by CI.

            - `openzclick-setup.exe` - Windows installer: per-user, no administrator
              prompt, shortcut and uninstaller included
            - `openzclick-windows-x64.zip` - Windows, unzip and run `openzclick.exe`
            - `app-release.apk` - Android, sideload directly (debug signing key)
            - `openzclick-unsigned.ipa` - iOS, sign with Sideloadly or AltStore
