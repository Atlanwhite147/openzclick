name: Web build

# The browser build pairs the controller over Web Bluetooth, which every
# browser only exposes to a secure context: GitHub Pages serves it over HTTPS,
# which is also why the build is deployed instead of only archived.
#
# The repository's Pages source must stay "GitHub Actions". Left on "Deploy from
# a branch", GitHub builds the README with Jekyll on every push to main and
# publishes it over this artifact: the site then serves the README as plain text
# while both deployments report success, which is exactly how it stayed broken
# without anyone noticing.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      # A project page lives under /<repository>/. Replace the base href with
      # "/" the day a custom domain serves the site from the root.
      - name: Build for the browser
        working-directory: app
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Show artifact
        working-directory: app
        run: du -sh build/web && ls build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
